<!doctype html>
<html lang="en" style="height:100%;overflow:hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arete</title>

    <!-- PWA / iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arete" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Arete: your training, nutrition, skin and looks, in one place" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/icon-512.png" />

    <!-- Google Identity Services — for Google Calendar OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body style="margin:0;background:#080808;height:100%;overflow:hidden;">
    <div id="root" style="background:#080808;height:100vh;height:100dvh;width:100%;overflow:hidden;">
      <!-- Shown until the app code arrives, then replaced by React. Fades in after 300 ms so a fast load never shows it. -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;">
        <div style="font-family:'Cinzel',serif,Georgia;font-size:26px;letter-spacing:.42em;padding-left:.42em;color:#F2EAD8;">ARETE</div>
        <div style="width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;"><div style="height:100%;width:100%;background:#D8B26E;transform-origin:left center;animation:pre-fill 1.2s cubic-bezier(.4,0,.2,1) both;"></div></div>
      </div>
      <style>@keyframes pre-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
