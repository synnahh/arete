<!doctype html>
<html lang="en" style="height:100%;overflow:hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arete</title>

    <!-- PWA / iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arete" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Turn your life around — training, nutrition, skin, finance & focus" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/icon-512.png" />

    <!-- Google Identity Services — for Google Calendar OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body style="margin:0;background:#080808;height:100%;overflow:hidden;">
    <div id="root" style="background:#080808;height:100vh;height:100dvh;width:100%;overflow:hidden;">
      <!-- Shown until the app code arrives, then replaced by React. Fades in after 300 ms so a fast load never shows it. -->
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;animation:pre-in .35s ease-out .3s both;">
        <div style="width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:#D8B26E;animation:pre-spin 1s linear infinite;"></div>
      </div>
      <style>@keyframes pre-in{from{opacity:0}to{opacity:1}}@keyframes pre-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
